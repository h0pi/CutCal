services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-CU24-ubuntu-22.04
    container_name: cutcal-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${DB_SA_PASSWORD}
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  rabbitmq:
    image: rabbitmq:3.12-management
    container_name: cutcal-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  api:
    build:
      context: ./backend
      dockerfile: CutCal.WebAPI/Dockerfile
    container_name: cutcal-api
    ports:
      - "5194:5194"
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    env_file: .env
    environment:
      ASPNETCORE_URLS: "http://+:5194"
      # Container addresses; everything else (secrets, JWT, SMTP, PayPal) comes from .env.
      ConnectionStrings__DefaultConnection: "Server=db,1433;Database=220240;User Id=sa;Password=${DB_SA_PASSWORD};TrustServerCertificate=True;MultipleActiveResultSets=true"
      RabbitMQ__Host: rabbitmq
    restart: on-failure

  worker:
    build:
      context: ./backend
      dockerfile: CutCal.Worker/Dockerfile
    container_name: cutcal-worker
    depends_on:
      rabbitmq:
        condition: service_healthy
    env_file: .env
    environment:
      RabbitMQ__Host: rabbitmq
    restart: on-failure

volumes:
  sqlserver_data:
